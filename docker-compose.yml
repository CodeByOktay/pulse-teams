name: pulse

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulse-app
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # ADR-036: time travel is off in production builds unless explicitly enabled.
      - ENABLE_TIME_TRAVEL=${ENABLE_TIME_TRAVEL:-false}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/auth/providers').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: pulse-agent
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/pulse?sslmode=disable
      - INTERNAL_API_URL=http://app:3000
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-pulse-internal-secret-key-change-in-prod}
      - TZ=Europe/Istanbul
      - HEARTBEAT_FILE=/tmp/pulse-agent-heartbeat
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      # The poller loop touches HEARTBEAT_FILE every iteration (wall clock, not the simulated clock).
      test: ["CMD", "python", "-m", "src.health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ./agent/src:/app/src

volumes:
  pgdata:
    name: pulse_pgdata
