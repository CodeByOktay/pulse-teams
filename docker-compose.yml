name: pulse

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulse-app
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: pulse-agent
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/pulse?sslmode=disable
      - INTERNAL_API_URL=http://app:3000
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-pulse-internal-secret-key-change-in-prod}
      - TZ=Europe/Istanbul
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - ./agent/src:/app/src

volumes:
  pgdata:
    name: pulse_pgdata
